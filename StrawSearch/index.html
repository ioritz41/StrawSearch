<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>StrawSearch</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="brand" aria-label="StrawSearch">
  <h1>Straw<span>Search</span></h1>
</header>

<div class="tabs" id="tabs"></div>

<div class="search-bar">

  <div class="nav">
    <button onclick="back()">←</button>
    <button onclick="reload()">↻</button>
    <button onclick="forward()">→</button>
  </div>

  <input id="search" placeholder="StrawSearch..." onkeydown="enter(event)">
  <button onclick="search()">🔎</button>

</div>

<div id="serverStatus" class="server-status" role="status">Connecting...</div>

<div id="content"></div>

<script src="script.js"></script>
</body>
</html>
