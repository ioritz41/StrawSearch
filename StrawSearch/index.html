<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrawSearch</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="tabs" id="tabs"></div>

<div class="search-bar">

  <div class="nav">
    <button type="button" title="Go back" onclick="navigation.back()">←</button>
    <button type="button" title="Reload page" onclick="navigation.reload()">↻</button>
    <button type="button" title="Go forward" onclick="navigation.forward()">→</button>
  </div>

  <input id="search" placeholder="StrawSearch..." onkeydown="enter(event)">
  <button type="button" title="Search" onclick="search()">🔎</button>

</div>

<header class="brand">
  <h1>Straw<span>Search</span></h1>
</header>

<div id="content"></div>

<script src="script.js"></script>
</body>
</html>
