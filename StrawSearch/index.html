<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrawSearch</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="tabs" id="tabs"></div>

<div class="search-bar">

  <div class="nav">
    <button type="button" title="Go back" aria-label="Go back" onclick="back()">←</button>
    <button type="button" title="Reload page" aria-label="Reload page" onclick="reload()">↻</button>
    <button type="button" title="Go forward" aria-label="Go forward" onclick="forward()">→</button>
  </div>

  <input id="search" placeholder="StrawSearch..." onkeydown="enter(event)">
  <button type="button" title="Search" aria-label="Search" onclick="search()">🔎</button>

</div>

<header class="brand" aria-label="StrawSearch">
  <h1>Straw<span>Search</span></h1>
</header>

<section class="account-panel" aria-label="Account and search history">
  <form id="accountForm">
    <input id="username" required minlength="3" maxlength="20" placeholder="Username" autocomplete="username">
    <input id="password" required minlength="8" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
    <button type="submit">Register / log in</button>
  </form>
  <button id="logoutButton" type="button" hidden>Log out</button>
  <p id="accountMessage" role="status">No account: search history is not saved.</p>
  <ul id="historyList"></ul>
</section>

<div id="content"></div>

<script src="script.js"></script>
</body>
</html>
