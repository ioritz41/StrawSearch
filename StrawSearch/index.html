<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>StrawSearch</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="tabs" id="tabs"></div>

<div class="search-bar">

  <div class="nav">
    <button type="button" title="Go back" aria-label="Go back" onclick="back()">←</button>
    <button type="button" title="Reload page" aria-label="Reload page" onclick="reload()">↻</button>
    <button type="button" title="Go forward" aria-label="Go forward" onclick="forward()">→</button>
  </div>

  <input id="search" placeholder="StrawSearch..." onkeydown="enter(event)">
  <button type="button" title="Search" aria-label="Search" onclick="search()">🔎</button>

</div>

<header class="brand" aria-label="StrawSearch">
  <h1>Straw<span>Search</span></h1>
</header>

<div id="content"></div>

<script src="script.js"></script>
</body>
</html>
